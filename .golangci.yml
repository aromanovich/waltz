version: "2"

# The linter is the second of the three homes .claude/rules/no-lint-in-tests.md
# names for a rule: not a compile error, not prose, but a check that runs as a
# check and points at the offending line. `make lint` is where it runs.
#
# What is enabled is what has already been made green over the whole tree. A
# linter that ships red is a linter everybody learns to ignore, so anything
# whose findings this repository decided against is switched off *here*, with
# the reason, rather than silenced one `//nolint` at a time.

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # The idiom half, one linter per family:
    - errorlint # a type switch or == on an error cannot see a wrapped one
    - gocritic # the shadowed builtin, the init clause that tests nothing
    - revive # the exported/return/naming rules of Go Code Review Comments
    - intrange # for i := 0; i < n; i++
    - copyloopvar # the pre-1.22 `x := x`
    - usestdlibvars
    - wastedassign
    - makezero
    - durationcheck
    - iface

  # Four linters are deliberately absent, and each would be red on code this
  # repository decided was right:
  #
  #   prealloc  — a `var out []T` grown in a loop is the readable spelling, and
  #               the capacity is a measurement nobody here has taken.
  #   nilnil    — mutation/decode.go returns (nil, nil) for an *absent*
  #               sub-message, which is the codec's absent-vs-empty rule; a
  #               sentinel error there would be a value every caller must ignore.
  #   noctx     — this module makes no HTTP call, opens no database and starts no
  #               process, so there is nothing here for it to judge; enabling a
  #               linter on an empty subject only invites the first code it would
  #               have judged to arrive with a `//nolint`.
  #   perfsprint— fmt.Sprintf over concatenation is a readability choice, and the
  #               one finding of its that is an idiom rule (fmt.Errorf with no
  #               verb) staticcheck already makes.

  settings:
    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: bool-literal-in-expr
        - name: identical-branches
        - name: modifies-value-receiver
        - name: string-of-int
        - name: unnecessary-stmt
        - name: useless-break
        - name: waitgroup-by-value
        - name: duplicated-imports
        - name: optimize-operands-order

    gocritic:
      enable-all: true
      disabled-checks:
        # Comment style is .claude/rules/comments.md's, and it is not this.
        - commentFormatting
        - commentedOutCode
        - todoCommentWithoutDetail
        - whyNoLint
        # Signature taste, not idiom.
        - unnamedResult
        - paramTypeCombine
        - tooManyResultsChecker
        # Copy cost is a measurement; none has been taken here.
        - hugeParam
        - rangeValCopy
        # A parameter shadowing a package name is how this tree reads already.
        - importShadow
        # `e.HeadSeqno-1 < out.CutSeqno` cannot become `<=`: a wal.Seqno is
        # unsigned, and the -1 is the value assigned on the next line, so the
        # comparison and the assignment stay the same expression.
        - boolExprSimplify
        # mutation.TaskSlot returns *map on purpose: a range delete writes
        # through the pointer, into the request's own map.
        - ptrToRefParam
        # `return j, j.Quiesced(...)` — j is a pointer, so evaluation order
        # cannot change what is returned.
        - evalOrder

    errcheck:
      check-type-assertions: false
      check-blank: false

    staticcheck:
      checks:
        - all
        # ST1000 (package comment shape) and ST1020-ST1022 (comment-on-export
        # shape) are the same file as gocritic's comment checks above.
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022
        # ST1003 wants initialisms upper-cased; the names here are the store's.
        - -ST1003
        # QF1008 would drop the embedded field from h.retired.Counters.add and
        # total.Counters.add: naming it is what tells the counters a cycle rolls
        # up from the seqnos and shard tallies sitting beside them in the same
        # struct.
        - -QF1008
        # QF1001's De Morgan rewrite of coldtasks' page predicate would stop it
        # being the cold store's condition transcribed.
        - -QF1001

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aromanovich/waltz

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
